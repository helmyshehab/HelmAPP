# Helm حلم — Supabase local config (version-controlled, Gate 2)
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "helm-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "identity", "catalog", "verification", "pricing", "packages", "commerce", "fulfillment", "ai", "ops"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://127.0.0.1:3001"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
