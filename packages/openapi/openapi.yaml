tags:
  - name: meta
    description: Health, readiness, and service metadata
  - name: identity
    description: Authenticated identity foundation (no product profile CMS yet)
  - name: catalog
    description: Public travel catalog discovery (published entries only)
  - name: geo
    description: Public read-only geographic reference lookups (countries, cities)
  - name: catalog-admin
    description: Staff catalog curation, lifecycle, and curated JSON import
  - name: audit-admin
    description: Administrator audit-history reads (not available to operators)
