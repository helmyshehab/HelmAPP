openapi: 3.1.0
info:
  title: Helm حلم API
  description: |
    Single source of truth for Helm حلم `/v1`.
    Step 5: travel catalog discovery + admin lifecycle/import.
    Step 6.1: destination admin, geo lookup, and audit-history contracts (implementation follows).
  version: 0.4.0
  contact:
    name: Helmy Shehab
servers:
  - url: http://127.0.0.1:8080
    description: Local helm-backend
security: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags: [meta]
      security: []
      responses:
        "200":
          description: Service process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/ready:
    get:
      operationId: getReady
      summary: Readiness probe
      tags: [meta]
      security: []
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Service is not ready (e.g. database configured but unreachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /v1/meta:
    get:
      operationId: getMeta
      summary: Service metadata
      tags: [meta]
      security: []
      responses:
        "200":
          description: Build / API metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
  /v1/me:
    get:
      operationId: getMe
      summary: Current authenticated principal
      tags: [identity]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated caller profile foundation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/destinations:
    get:
      operationId: listDestinations
      summary: List published destinations
      tags: [catalog]
      security: []
      parameters:
        - $ref: "#/components/parameters/CountryFilter"
        - $ref: "#/components/parameters/FeaturedFilter"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated published destinations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/destinations/{slug}:
    get:
      operationId: getDestination
      summary: Get a published destination by slug
      tags: [catalog]
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Published destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationPublic"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/catalog/places:
    get:
      operationId: listCatalogPlaces
      summary: Search published catalog places
      tags: [catalog]
      security: []
      parameters:
        - $ref: "#/components/parameters/CountryFilter"
        - name: city
          in: query
          schema:
            type: string
        - name: area
          in: query
          schema:
            type: string
        - name: destinationSlug
          in: query
          description: >
            Optional exact match on the place's destination slug. When omitted,
            destination filtering is unchanged. When provided, must be nonblank
            and at most 120 characters.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/PlaceCategory"
        - name: subcategory
          in: query
          schema:
            type: string
        - name: minRating
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 10
        - name: priceLevel
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 4
        - name: tag
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/FeaturedFilter"
        - $ref: "#/components/parameters/SearchQuery"
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, rating, updated]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated published places
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/catalog/places/{slug}:
    get:
      operationId: getCatalogPlace
      summary: Get a published place by slug
      tags: [catalog]
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Published place with public media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacePublic"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/catalog/categories:
    get:
      operationId: listCatalogCategories
      summary: Catalog category taxonomy
      tags: [catalog]
      security: []
      responses:
        "200":
          description: Category groups and subcategories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
  /v1/catalog/tags:
    get:
      operationId: listCatalogTags
      summary: Active catalog tags
      tags: [catalog]
      security: []
      responses:
        "200":
          description: Active tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagListResponse"
  /v1/geo/countries:
    get:
      operationId: listGeoCountries
      summary: List countries (public read-only)
      description: |
        Canonical `geo.countries` lookup for pickers. Read-only; no write methods on `/v1/geo/*`.
      tags: [geo]
      security: []
      parameters:
        - name: active
          in: query
          description: When true, only active countries (default true when omitted by clients that pass it)
          schema:
            type: string
            enum: ["true", "false"]
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Country list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoCountryListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/geo/cities:
    get:
      operationId: listGeoCities
      summary: List cities (public read-only)
      description: |
        Canonical `geo.cities` lookup. Prefer filtering by `country` (ISO-3166-1 alpha-2).
        Read-only; no write methods on `/v1/geo/*`.
      tags: [geo]
      security: []
      parameters:
        - $ref: "#/components/parameters/CountryFilter"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: City list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoCityListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/admin/catalog/destinations:
    get:
      operationId: adminListCatalogDestinations
      summary: Staff list of catalog destinations (includes unpublished)
      tags: [catalog-admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/CountryFilter"
        - $ref: "#/components/parameters/FeaturedFilter"
        - name: lifecycleStatus
          in: query
          schema:
            $ref: "#/components/schemas/LifecycleStatus"
        - name: parentId
          in: query
          description: Filter by parent destination id; omit for any
          schema:
            type: string
            format: uuid
        - name: topLevelOnly
          in: query
          description: When true, only destinations with no parent
          schema:
            type: string
            enum: ["true", "false"]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Staff destination list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationAdminListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: adminCreateCatalogDestination
      summary: Create a draft catalog destination
      description: |
        Always creates `lifecycleStatus=draft` for every actor (operator or administrator).
        Clients must not supply a lifecycle status; any such field is rejected by the implementation.
      tags: [catalog-admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDestinationRequest"
      responses:
        "201":
          description: Draft destination created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationAdmin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/catalog/destinations/{id}:
    get:
      operationId: adminGetCatalogDestination
      summary: Get a catalog destination by id (staff)
      tags: [catalog-admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DestinationId"
      responses:
        "200":
          description: Staff destination detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationAdmin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: adminUpdateCatalogDestination
      summary: Update a catalog destination
      description: |
        Operators may update only curatable lifecycles (draft, pending_verification, rejected).
        Slug may be changed only before publication. Published slugs are immutable via this
        endpoint; exceptional post-publish renames require a dedicated audited redirect/alias
        flow (not part of this contract surface).
      tags: [catalog-admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DestinationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDestinationRequest"
      responses:
        "200":
          description: Updated destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationAdmin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/catalog/destinations/{id}/transition:
    post:
      operationId: adminTransitionCatalogDestination
      summary: Transition destination lifecycle
      description: |
        Follows the shared catalog lifecycle state machine (same edges as Step 5 places).
        Allowed from → to transitions (runtime-validated against the current DB status):

        - draft → pending_verification, archived, rejected
        - pending_verification → verified, rejected, draft
        - verified → approved, rejected, pending_verification
        - approved → published, rejected, archived
        - published → archived
        - rejected → draft, pending_verification, archived
        - archived → draft

        Same-status transitions (`from === to`) are allowed for every status (no-op).
        Invalid edges return HTTP 400.
        Stale concurrent updates (row lifecycle no longer matches the expected
        from-status used for optimistic concurrency) return HTTP 409.

        Admin-only target statuses: verified, approved, published, archived.
        Operators may submit for verification (and other non-admin targets); reaching
        those admin-only targets requires administrator or super-administrator.
      tags: [catalog-admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DestinationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LifecycleTransitionRequest"
      responses:
        "200":
          description: Updated destination lifecycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationAdmin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/catalog/destinations/{id}/tags:
    put:
      operationId: adminReplaceCatalogDestinationTags
      summary: Replace destination tags (explicit set)
      description: |
        Manual tag editing uses explicit replacement semantics — the provided `tagSlugs`
        become the full tag set for the destination (transactional). JSON import remains
        additive and is unchanged by this contract.
      tags: [catalog-admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DestinationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceDestinationTagsRequest"
      responses:
        "200":
          description: Destination with replaced tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationAdmin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/audit-events:
    get:
      operationId: adminListAuditEvents
      summary: List audit events for an entity
      description: |
        Restricted to administrator and super-administrator. Operators must rely on
        lifecycle actor timestamps on the destination resource instead of this API.
      tags: [audit-admin]
      security:
        - bearerAuth: []
      parameters:
        - name: entityType
          in: query
          required: true
          schema:
            type: string
            enum: [destination, place, import_run, poi, media, rating, price]
        - name: entityId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/catalog/places:
    get:
      operationId: adminListCatalogPlaces
      summary: Staff list of catalog places (includes unpublished)
      tags: [catalog-admin]
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Staff place list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: adminCreateCatalogPlace
      summary: Create a draft catalog place
      tags: [catalog-admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlaceRequest"
      responses:
        "201":
          description: Draft place created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceAdminSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/catalog/places/{id}/transition:
    post:
      operationId: adminTransitionCatalogPlace
      summary: Transition place lifecycle (verify/approve/publish/reject/archive)
      tags: [catalog-admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LifecycleTransitionRequest"
      responses:
        "200":
          description: Updated place lifecycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceAdminSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/catalog/import-runs:
    get:
      operationId: adminListCatalogImportRuns
      summary: List catalog import runs (newest first)
      description: |
        Staff-readable history of dry-run and apply runs from catalog.import_runs.
        Does not return original JSON payloads (not stored). Use GET by id for error details.
        Pagination total is authoritative for the filtered set — do not invent global totals.
      tags: [catalog-admin]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CatalogImportRunStatus"
        - name: dryRun
          in: query
          required: false
          schema:
            type: boolean
          description: When set, filter dry-run vs apply runs
        - name: sourceLabel
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: Case-insensitive substring match on source_label
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated import runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogImportRunListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/catalog/import-runs/{id}:
    get:
      operationId: adminGetCatalogImportRun
      summary: Get one catalog import run with error report
      description: |
        Returns run metadata, summary counts, and stored error_report.
        Does not include the original import JSON (not persisted).
        For actor audit trail, use GET /v1/admin/audit-events?entityType=import_run&entityId=…
      tags: [catalog-admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Import run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogImportRunDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/catalog/import:
    post:
      operationId: adminImportCatalog
      summary: Validate or apply curated JSON catalog import
      tags: [catalog-admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogImportRequest"
      responses:
        "200":
          description: Import preview or apply result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token (or local mock JWT)
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    DestinationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CountryFilter:
      name: country
      in: query
      schema:
        type: string
        minLength: 2
        maxLength: 2
    FeaturedFilter:
      name: featured
      in: query
      schema:
        type: string
        enum: ["true", "false"]
    SearchQuery:
      name: q
      in: query
      schema:
        type: string
        maxLength: 120
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Insufficient permissions
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: |
        Resource state conflict (for example, a stale concurrent lifecycle
        transition where the expected from-status no longer matches)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: helm-backend
        timestamp:
          type: string
          format: date-time
    ReadyResponse:
      type: object
      required: [status, service, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        service:
          type: string
          example: helm-backend
        checks:
          type: object
          required: [database]
          properties:
            database:
              type: string
              enum: [ok, skipped, failed]
        detail:
          type: string
        timestamp:
          type: string
          format: date-time
    MetaResponse:
      type: object
      required: [name, version, apiVersion]
      properties:
        name:
          type: string
          example: Helm حلم
        version:
          type: string
          example: 0.1.0
        apiVersion:
          type: string
          example: v1
    MeResponse:
      type: object
      required: [userId, roles, rolesSource]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            $ref: "#/components/schemas/AppRole"
        rolesSource:
          type: string
          description: database = identity.user_roles; fallback = fail-closed customer-only
          enum: [database, fallback]
    AppRole:
      type: string
      enum: [customer, operator, administrator, super-administrator]
    LifecycleStatus:
      type: string
      enum:
        - draft
        - pending_verification
        - verified
        - approved
        - published
        - rejected
        - archived
    PlaceCategory:
      type: string
      enum:
        - accommodation
        - restaurant
        - cafe
        - bar
        - beach_club
        - attraction
        - activity
        - nightlife
        - transport
    DestinationPublic:
      type: object
      required: [id, slug, nameEn, nameAr, countryCode, status]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        nameEn:
          type: string
        nameAr:
          type: string
        summaryEn:
          type: string
        summaryAr:
          type: string
        countryCode:
          type: string
        cityId:
          type: string
          format: uuid
        timezone:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        isFeatured:
          type: boolean
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [published]
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DestinationListResponse:
      type: object
