name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

# Free GitHub Actions only — no paid runners or third-party SaaS.
jobs:
  openapi-clients:
    name: OpenAPI → clients regen cleanliness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate OpenAPI stub
        run: pnpm --filter @helm/openapi lint
      - name: Regenerate clients from OpenAPI SoT
        run: pnpm codegen
      - name: Fail if generated clients are dirty
        run: |
          if ! git diff --exit-code -- packages/api-client-ts packages/api-client-dart; then
            echo "::error::Generated clients differ after codegen. Never hand-edit; fix OpenAPI SoT and regenerate."
            exit 1
          fi
      - name: Assert DO NOT EDIT headers
        run: |
          pnpm --filter @helm/api-client-ts lint
          pnpm --filter @helm/api-client-dart lint

  migrations-present:
    name: Migration presence (Gate 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require version-controlled migrations + seed + config
        run: |
          test -f supabase/config.toml
          test -f supabase/seed.sql
          test -d supabase/migrations
          count=$(find supabase/migrations -name '*.sql' | wc -l)
          echo "migration_files=$count"
          test "$count" -ge 1
          # Ensure RLS stub migration exists
          ls supabase/migrations/*rls*.sql

  backend-typecheck:
    name: Backend typecheck
    runs-on: ubuntu-latest
    needs: [openapi-clients]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @helm/api-client-ts build
      - run: pnpm --filter @helm/helm-backend typecheck
      - run: pnpm --filter @helm/helm-backend test

  web-typecheck:
    name: Next.js web/admin typecheck
    runs-on: ubuntu-latest
    needs: [openapi-clients]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @helm/api-client-ts build
      - run: pnpm --filter helm-web typecheck
      - run: pnpm --filter helm-admin typecheck

  mobile-flutter:
    name: Flutter mobile analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLUTTER_VERSION: "3.27.4"
    defaults:
      run:
        working-directory: apps/helm_mobile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: flutter pub get
      - run: flutter analyze --no-pub lib test tool
      - run: flutter test --no-pub

  migrations-apply:
    name: Migration apply reproducibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
      - name: Apply migrations + seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          SEED: "true"
          MIGRATION_MODE: plain-postgres
        run: |
          set -euo pipefail
          out="$(mktemp)"
          ./scripts/apply-migrations.sh | tee "$out"
          grep -F 'SKIP supabase-only migration: 20261126160000_catalog_media_storage_bucket.sql' "$out"
      - name: Assert seed destinations exist and no fake storage tables
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          count=$(psql -h 127.0.0.1 -U postgres -d postgres -Atc "select count(*) from catalog.destinations where publish_status='published'")
          echo "published_destinations=$count"
          test "$count" -ge 1
          markets=$(psql -h 127.0.0.1 -U postgres -d postgres -Atc "select count(*) from markets.markets where code='EG_OUTBOUND'")
          test "$markets" -eq 1
          # Plain Postgres must not invent storage.* stubs.
          buckets="$(psql -h 127.0.0.1 -U postgres -d postgres -Atc "select coalesce(to_regclass('storage.buckets')::text, '')")"
          objects="$(psql -h 127.0.0.1 -U postgres -d postgres -Atc "select coalesce(to_regclass('storage.objects')::text, '')")"
          test -z "$buckets"
          test -z "$objects"
      - name: Seed idempotency (second apply)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          SEED: "true"
          MIGRATION_MODE: plain-postgres
        run: |
          set -euo pipefail
          out="$(mktemp)"
          ./scripts/apply-migrations.sh | tee "$out"
          grep -F 'SKIP supabase-only migration: 20261126160000_catalog_media_storage_bucket.sql' "$out"
      - name: RLS harness (customer / administrator contexts)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MIGRATION_MODE: plain-postgres
        run: ./scripts/test-rls.sh
      - name: Step 6.3 database integrity harness
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MIGRATION_MODE: plain-postgres
        run: ./scripts/test-db-integrity.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Catalog D9 operator authz Nest HTTP (must not skip)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          SUPABASE_JWT_SECRET: test-only-helm-jwt-secret-min-32-chars!!
        run: |
          set -euo pipefail
          out="$(mktemp)"
          pnpm --filter @helm/helm-backend exec node --import tsx --test \
            test/catalog-d9-authz-integration.test.ts | tee "$out"
          grep -E '^# tests 1$' "$out"
          grep -E '^# pass 1$' "$out"
          grep -E '^# fail 0$' "$out"
          grep -E '^# skipped 0$' "$out"
      - name: Customer profile bootstrap Nest HTTP (must not skip)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          SUPABASE_JWT_SECRET: test-only-helm-jwt-secret-min-32-chars!!
        run: |
          set -euo pipefail
          out="$(mktemp)"
          pnpm --filter @helm/helm-backend exec node --import tsx --test \
            test/customer-profile-bootstrap.test.ts | tee "$out"
          grep -E '^# tests 2$' "$out"
          grep -E '^# pass 2$' "$out"
          grep -E '^# fail 0$' "$out"
          grep -E '^# skipped 0$' "$out"
      - name: Trip drafts Nest HTTP (must not skip)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          SUPABASE_JWT_SECRET: test-only-helm-jwt-secret-min-32-chars!!
        run: |
          set -euo pipefail
          out="$(mktemp)"
          pnpm --filter @helm/helm-backend exec node --import tsx --test \
            test/trip-drafts-api.test.ts | tee "$out"
          grep -E '^# tests 1$' "$out"
          grep -E '^# pass 1$' "$out"
          grep -E '^# fail 0$' "$out"
          grep -E '^# skipped 0$' "$out"
      - name: Trip draft itinerary Nest HTTP (must not skip)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          SUPABASE_JWT_SECRET: test-only-helm-jwt-secret-min-32-chars!!
        run: |
          set -euo pipefail
          out="$(mktemp)"
          pnpm --filter @helm/helm-backend exec node --import tsx --test \
            test/trip-draft-itinerary-api.test.ts | tee "$out"
          grep -E '^# tests 1$' "$out"
          grep -E '^# pass 1$' "$out"
          grep -E '^# fail 0$' "$out"
          grep -E '^# skipped 0$' "$out"
      - name: Packages Nest HTTP (must not skip)
        timeout-minutes: 5
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          SUPABASE_JWT_SECRET: test-only-helm-jwt-secret-min-32-chars!!
        run: |
          set -euo pipefail
          out="$(mktemp)"
          pnpm --filter @helm/helm-backend exec node --import tsx --test \
            --test-timeout=120000 test/packages-api.test.ts | tee "$out"
          grep -E '^# tests 1$' "$out"
          grep -E '^# pass 1$' "$out"
          grep -E '^# fail 0$' "$out"
          grep -E '^# skipped 0$' "$out"

  # Single shared Flutter web preview → staging API + Supabase anon.
  # Runs only after green CI on main. Hosting: GitHub Pages ($0).
  deploy-flutter-web-preview:
    name: Deploy Flutter web staging preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - openapi-clients
      - migrations-present
      - backend-typecheck
      - web-typecheck
      - mobile-flutter
      - migrations-apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      FLUTTER_VERSION: "3.27.4"
    defaults:
      run:
        working-directory: apps/helm_mobile
    steps:
      - uses: actions/checkout@v4
      - name: Require staging Supabase secrets
        env:
          HELM_SUPABASE_URL: ${{ secrets.HELM_SUPABASE_URL }}
          HELM_SUPABASE_ANON_KEY: ${{ secrets.HELM_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HELM_SUPABASE_URL}" ] || [ -z "${HELM_SUPABASE_ANON_KEY}" ]; then
            echo "::error::Set repo secrets HELM_SUPABASE_URL and HELM_SUPABASE_ANON_KEY (anon/publishable only)."
            exit 1
          fi
      - name: Set up Flutter
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: flutter pub get
      - name: Build web against staging
        env:
          HELM_SUPABASE_URL: ${{ secrets.HELM_SUPABASE_URL }}
          HELM_SUPABASE_ANON_KEY: ${{ secrets.HELM_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          flutter build web --release --target lib/main.dart \
            --base-href=/HelmAPP/ \
            --dart-define=HELM_API_BASE_URL=https://helm-staging-api-ujqa.onrender.com \
            --dart-define=HELM_SUPABASE_URL="$HELM_SUPABASE_URL" \
            --dart-define=HELM_SUPABASE_ANON_KEY="$HELM_SUPABASE_ANON_KEY" \
            --dart-define=HELM_GIT_SHA="${GITHUB_SHA}"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/helm_mobile/build/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
