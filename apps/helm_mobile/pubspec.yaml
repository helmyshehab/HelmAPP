name: helm_mobile
description: Helm حلم mobile app (Step 2 navigation skeleton)
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  helm_api_client:
    path: ../../packages/api-client-dart
  http: 1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - fonts/licenses/Fraunces-OFL.txt
    - fonts/licenses/Outfit-OFL.txt
    - fonts/licenses/IBMPlexSansArabic-OFL.txt
  fonts:
    - family: Fraunces
      fonts:
        - asset: fonts/Fraunces9pt-Regular.ttf
          weight: 400
        - asset: fonts/Fraunces9pt-SemiBold.ttf
          weight: 600
    - family: Outfit
      fonts:
        - asset: fonts/Outfit-Regular.ttf
          weight: 400
        - asset: fonts/Outfit-Medium.ttf
          weight: 500
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
